<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0F5156" />
  <title>Admin Panel — MyKampung Firebase CMS</title>
  <link rel="manifest" href='data:application/manifest+json,{"name":"Admin MyKampung","short_name":"AdminMK","start_url":"admin.html","display":"standalone","background_color":"#F8FAFC","theme_color":"#0F5156","icons":[{"src":"https://ui-avatars.com/api/?name=AD&background=0F5156&color=fff&size=192","sizes":"192x192","type":"image/png"}]}' />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F8FAFC; color: #0F172A; }
    .glass { background: rgba(255,255,255,0.9); backdrop-filter: blur(12px); }
    .fade-in { animation: fadeIn 0.2s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="min-h-screen">

  <!-- LOGIN SCREEN -->
  <div id="login-screen" class="min-h-screen bg-gradient-to-br from-[#0F5156] via-[#115E59] to-[#0B3F42] flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl shadow-2xl max-w-md w-full p-8 fade-in">
      <div class="flex items-center gap-3 mb-6">
        <div class="w-12 h-12 rounded-2xl bg-[#115E59] text-white flex items-center justify-center shadow"><i data-lucide="shield-check" class="w-6 h-6"></i></div>
        <div>
          <h1 class="text-xl font-extrabold">Admin <span class="text-orange-600">MyKampung</span></h1>
          <p class="text-xs text-slate-500">Firebase Cloud CMS Pengelola</p>
        </div>
      </div>
      <form onsubmit="window.handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Email Admin</label>
          <input id="login-email" type="email" required placeholder="admin@mykampung.id" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm" />
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Password</label>
          <input id="login-pass" type="password" required placeholder="••••••••" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm" />
        </div>
        <div id="login-err" class="hidden text-xs text-red-600 font-semibold"></div>
        <button type="submit" class="w-full py-3 rounded-xl bg-gradient-to-r from-amber-500 to-orange-600 text-white font-bold text-sm shadow-lg">Masuk ke Dashboard</button>
      </form>
      <div class="mt-5 pt-4 border-t border-slate-100 text-center">
        <a href="index.html" class="text-xs text-teal-700 font-bold hover:underline">Lihat Web Utama &rarr;</a>
      </div>
    </div>
  </div>

  <!-- ADMIN APP -->
  <div id="admin-app" class="hidden min-h-screen flex pb-16 lg:pb-0">
    <aside class="hidden lg:flex w-64 bg-[#0F5156] text-white flex-col sticky top-0 h-screen">
      <div class="p-5 border-b border-teal-800 flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-amber-500 flex items-center justify-center"><i data-lucide="home" class="w-5 h-5"></i></div>
        <div><div class="font-extrabold leading-none">MyKampung</div><div class="text-[11px] text-teal-200 mt-0.5">Firebase CMS</div></div>
      </div>
      <nav id="admin-sidebar-nav" class="flex-1 p-3 space-y-1 overflow-y-auto text-sm"></nav>
      <div class="p-3 border-t border-teal-800 space-y-2">
        <a href="index.html" target="_blank" class="w-full py-2 px-3 rounded-xl bg-white/10 hover:bg-white/20 text-xs font-bold flex items-center justify-center gap-2"><i data-lucide="external-link" class="w-3.5 h-3.5 text-amber-400"></i> Web Utama</a>
        <button onclick="window.handleLogout()" class="w-full py-2 px-3 rounded-xl text-teal-200 hover:bg-red-500/20 text-xs font-semibold flex items-center justify-center gap-2"><i data-lucide="log-out" class="w-3.5 h-3.5"></i> Keluar</button>
      </div>
    </aside>

    <div class="flex-1 flex flex-col min-w-0">
      <header class="glass border-b border-slate-200 px-4 lg:px-8 py-3.5 sticky top-0 z-30 flex items-center justify-between">
        <h2 id="panel-title" class="text-lg font-extrabold text-slate-900">Dashboard</h2>
        <div class="flex items-center gap-3">
          <span class="inline-flex items-center gap-1.5 text-xs font-bold px-3 py-1 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Firebase Live
          </span>
          <button onclick="window.handleLogout()" class="lg:hidden text-xs font-bold text-red-600">Keluar</button>
        </div>
      </header>
      <main id="admin-content" class="p-4 lg:p-8 flex-1 max-w-6xl w-full mx-auto"></main>
    </div>

    <nav id="admin-mobile-nav" class="lg:hidden fixed bottom-0 inset-x-0 z-40 glass border-t border-slate-200 px-1 py-1.5 flex items-center justify-around shadow-lg overflow-x-auto"></nav>
  </div>

  <!-- MODAL CRUD -->
  <div id="crud-modal" class="fixed inset-0 z-50 hidden bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4" onclick="if(event.target===this) window.closeModal()">
    <div class="bg-white rounded-2xl max-w-xl w-full max-h-[90vh] overflow-y-auto shadow-2xl fade-in">
      <div class="sticky top-0 bg-white px-6 py-4 border-b border-slate-100 flex items-center justify-between">
        <h3 id="crud-title" class="font-extrabold">Form Data</h3>
        <button onclick="window.closeModal()" class="p-1.5 rounded-full hover:bg-slate-100"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div id="crud-body" class="p-6"></div>
    </div>
  </div>

  <div id="toast" class="fixed bottom-20 lg:bottom-5 right-5 z-50 hidden bg-[#0F5156] text-white px-5 py-3 rounded-2xl shadow-xl text-xs font-bold"></div>

  <script type="module">
    // KONFIGURASI APLIKASI (MODE PRODUKSI FIREBASE)
    const IS_PREVIEW = false;

    const firebaseConfig = {
      apiKey: "AIzaSyByGQOGJsgAujxq9lkEJ4UgCOMW824mF24",
      authDomain: "juragankos-aab60.firebaseapp.com",
      databaseURL: "https://juragankos-aab60-default-rtdb.firebaseio.com",
      projectId: "juragankos-aab60",
      storageBucket: "juragankos-aab60.firebasestorage.app",
      messagingSenderId: "993946963863",
      appId: "1:993946963863:web:ce5e709d12294898ad7ed2",
      measurementId: "G-CNYLS85FPR"
    };

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, doc, collection, onSnapshot, setDoc, addDoc, updateDoc, deleteDoc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const app = initializeApp(firebaseConfig);
    try { getAnalytics(app); } catch {}
    const auth = getAuth(app);
    const db = getFirestore(app);

    let activeTab = 'dashboard';
    const state = {
      beranda: { nama: 'MyKampung', domain: 'MyKampung.my.id | Portal Informasi Kampung Kita', tagline: 'Portal Informasi Kampung', heroKecil: 'Kampung Kita', heroHighlight: 'Kampung yang Asri, Guyub, dan Berdaya', heroSub: 'Informasi, kegiatan, layanan, dan potensi kampung dalam satu portal.', heroImg: 'https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=1600&q=80', fb: '', ig: '', yt: '' },
      profil: { sejarah: '', visi: '', misi: [], stats: { penduduk: '0', kk: '0', rt: '0', rw: '0' }, perangkat: [] },
      kontak: { alamat: '', telepon: '', whatsapp: '', email: '', jam: '' },
      berita: [], galeri: [], layanan: [], potensi: [], agenda: [], pesanWarga: []
    };

    const MENU = [
      { id: 'dashboard', label: 'Dashboard', icon: 'layout-dashboard', mob: true },
      { id: 'beranda', label: 'Beranda', icon: 'home', mob: false },
      { id: 'profil', label: 'Profil', icon: 'users', mob: false },
      { id: 'berita', label: 'Berita', icon: 'newspaper', mob: true },
      { id: 'galeri', label: 'Galeri', icon: 'images', mob: false },
      { id: 'layanan', label: 'Layanan', icon: 'clipboard-list', mob: true },
      { id: 'potensi', label: 'Potensi', icon: 'sprout', mob: false },
      { id: 'agenda', label: 'Agenda', icon: 'megaphone', mob: true },
      { id: 'kontak', label: 'Kontak', icon: 'mail', mob: true }
    ];

    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('admin-app').classList.remove('hidden');
        bindFirestore();
        renderUI();
      } else {
        document.getElementById('login-screen').classList.remove('hidden');
        document.getElementById('admin-app').classList.add('hidden');
      }
    });

    function bindFirestore() {
      onSnapshot(doc(db, 'settings', 'beranda'), s => { if (s.exists()) state.beranda = { ...state.beranda, ...s.data() }; renderUI(); });
      onSnapshot(doc(db, 'settings', 'profil'), s => { if (s.exists()) state.profil = { ...state.profil, ...s.data() }; renderUI(); });
      onSnapshot(doc(db, 'settings', 'kontak'), s => { if (s.exists()) state.kontak = { ...state.kontak, ...s.data() }; renderUI(); });
      const bindCol = (colName, key) => {
        onSnapshot(query(collection(db, colName), orderBy('createdAt', 'desc')), snap => {
          state[key] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          renderUI();
        }, () => {
          onSnapshot(collection(db, colName), snap => { state[key] = snap.docs.map(d => ({ id: d.id, ...d.data() })); renderUI(); });
        });
      };
      bindCol('berita', 'berita'); bindCol('galeri', 'galeri'); bindCol('layanan', 'layanan');
      bindCol('potensi', 'potensi'); bindCol('agenda', 'agenda'); bindCol('pesan_warga', 'pesanWarga');
    }

    window.handleLogin = async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const pass = document.getElementById('login-pass').value.trim();
      const err = document.getElementById('login-err');
      err.classList.add('hidden');
      try {
        await signInWithEmailAndPassword(auth, email, pass);
      } catch {
        err.textContent = 'Login gagal: Email atau password tidak terdaftar di Firebase Auth.';
        err.classList.remove('hidden');
      }
    };

    window.handleLogout = async () => { await signOut(auth); };

    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.remove('hidden');
      setTimeout(() => t.classList.add('hidden'), 2600);
    }

    function renderUI() {
      document.getElementById('admin-sidebar-nav').innerHTML = MENU.map(m => `
        <button onclick="window.switchTab('${m.id}')" class="w-full px-3.5 py-2.5 rounded-xl flex items-center gap-3 font-semibold transition ${activeTab===m.id ? 'bg-white/15 text-amber-300' : 'text-teal-100 hover:bg-white/10'}">
          <i data-lucide="${m.icon}" class="w-4 h-4"></i><span>${m.label}</span>
          ${m.id==='kontak' && state.pesanWarga.length ? `<span class="ml-auto bg-amber-500 text-white text-[10px] px-2 py-0.5 rounded-full">${state.pesanWarga.length}</span>` : ''}
        </button>`).join('');

      document.getElementById('admin-mobile-nav').innerHTML = MENU.filter(m => m.mob).map(m => `
        <button onclick="window.switchTab('${m.id}')" class="flex flex-col items-center gap-0.5 px-2 py-1 rounded-xl text-[10px] font-bold ${activeTab===m.id ? 'text-[#115E59] bg-teal-50' : 'text-slate-500'}">
          <i data-lucide="${m.icon}" class="w-5 h-5"></i><span>${m.label}</span>
        </button>`).join('');

      const item = MENU.find(m => m.id === activeTab);
      document.getElementById('panel-title').textContent = item ? item.label : 'Dashboard';
      const el = document.getElementById('admin-content');
      if (activeTab === 'dashboard') el.innerHTML = pDashboard();
      else if (activeTab === 'beranda') el.innerHTML = pBeranda();
      else if (activeTab === 'profil') el.innerHTML = pProfil();
      else if (activeTab === 'berita') el.innerHTML = pBerita();
      else if (activeTab === 'galeri') el.innerHTML = pGaleri();
      else if (activeTab === 'layanan') el.innerHTML = pLayanan();
      else if (activeTab === 'potensi') el.innerHTML = pPotensi();
      else if (activeTab === 'agenda') el.innerHTML = pAgenda();
      else if (activeTab === 'kontak') el.innerHTML = pKontak();
      lucide.createIcons();
    }

    window.switchTab = (t) => { activeTab = t; renderUI(); };
    window.closeModal = () => document.getElementById('crud-modal').classList.add('hidden');
    function openModal(title, html) {
      document.getElementById('crud-title').textContent = title;
      document.getElementById('crud-body').innerHTML = html;
      document.getElementById('crud-modal').classList.remove('hidden');
      lucide.createIcons();
    }
    const inp = (id, label, v) => `<div><label class="block text-xs font-bold text-slate-700 mb-1">${label}</label><input id="${id}" type="text" value="${String(v||'').replace(/"/g,'&quot;')}" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm" /></div>`;
    const val = (id) => document.getElementById(id).value.trim();

    function pDashboard() {
      return `<div class="grid grid-cols-2 lg:grid-cols-4 gap-4 fade-in">
        ${[['Berita', state.berita.length, 'berita'],['Agenda', state.agenda.length, 'agenda'],['Potensi & Galeri', state.potensi.length + state.galeri.length, 'potensi'],['Pesan Warga', state.pesanWarga.length, 'kontak']].map(x => `
          <div onclick="window.switchTab('${x[2]}')" class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 cursor-pointer hover:shadow-md">
            <div class="text-2xl font-extrabold text-[#115E59]">${x[1]}</div><div class="text-xs text-slate-500 font-semibold mt-1">${x[0]}</div>
          </div>`).join('')}
      </div>`;
    }

    function pBeranda() {
      const b = state.beranda;
      return `<form onsubmit="window.saveSettings(event,'beranda')" class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-4 fade-in">
        <div class="grid md:grid-cols-2 gap-4">
          ${inp('b-nama','Nama Portal',b.nama)} ${inp('b-tagline','Tagline',b.tagline)}
          ${inp('b-domain','Teks Top Bar',b.domain)} ${inp('b-hk','Judul Kecil Hero',b.heroKecil)}
          ${inp('b-hh','Judul Utama Hero (Kuning)',b.heroHighlight)} ${inp('b-img','URL Gambar Hero',b.heroImg)}
        </div>
        ${inp('b-sub','Deskripsi Hero',b.heroSub)}
        <div class="grid md:grid-cols-3 gap-4">${inp('b-fb','Facebook',b.fb)} ${inp('b-ig','Instagram',b.ig)} ${inp('b-yt','YouTube',b.yt)}</div>
        <button type="submit" class="px-6 py-2.5 rounded-xl bg-amber-500 text-white font-bold text-sm">Simpan Beranda</button>
      </form>`;
    }

    function pProfil() {
      const p = state.profil;
      return `<form onsubmit="window.saveSettings(event,'profil')" class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-4 fade-in">
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
          ${inp('p-pend','Penduduk',p.stats?.penduduk)} ${inp('p-kk','KK',p.stats?.kk)} ${inp('p-rt','RT',p.stats?.rt)} ${inp('p-rw','RW',p.stats?.rw)}
        </div>
        <div><label class="block text-xs font-bold mb-1">Sejarah</label><textarea id="p-sej" rows="3" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm">${p.sejarah||''}</textarea></div>
        ${inp('p-visi','Visi',p.visi)}
        <div><label class="block text-xs font-bold mb-1">Misi (per baris)</label><textarea id="p-misi" rows="3" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm">${(p.misi||[]).join('\n')}</textarea></div>
        <button type="submit" class="px-6 py-2.5 rounded-xl bg-amber-500 text-white font-bold text-sm">Simpan Profil</button>
      </form>`;
    }

    function pBerita() {
      return `<div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 fade-in">
        <div class="flex justify-between items-center mb-4"><h3 class="font-extrabold">Berita (${state.berita.length})</h3><button onclick="window.formBerita()" class="px-4 py-2 rounded-xl bg-amber-500 text-white text-xs font-bold">+ Tambah</button></div>
        <div class="space-y-3">${state.berita.map(b => `
          <div class="border border-slate-200 rounded-xl p-3 flex items-center justify-between gap-3">
            <div class="min-w-0"><div class="font-bold text-sm truncate">${b.judul}</div><div class="text-xs text-slate-500">${b.kategori} • ${b.tanggal} • ${b.status}</div></div>
            <div class="space-x-2 shrink-0"><button onclick="window.formBerita('${b.id}')" class="text-xs font-bold text-teal-700">Edit</button><button onclick="window.delDoc('berita','${b.id}')" class="text-xs font-bold text-red-600">Hapus</button></div>
          </div>`).join('') || '<p class="text-xs text-slate-400">Belum ada data.</p>'}</div>
      </div>`;
    }

    function pGaleri() {
      return `<div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 fade-in">
        <div class="flex justify-between items-center mb-4"><h3 class="font-extrabold">Galeri (${state.galeri.length})</h3><button onclick="window.formGaleri()" class="px-4 py-2 rounded-xl bg-amber-500 text-white text-xs font-bold">+ Tambah</button></div>
        <div class="grid sm:grid-cols-3 gap-4">${state.galeri.map(g => `
          <div class="border border-slate-200 rounded-xl overflow-hidden"><img src="${g.url}" class="w-full h-28 object-cover" /><div class="p-3 flex justify-between items-center"><span class="text-xs font-bold truncate">${g.judul}</span><button onclick="window.delDoc('galeri','${g.id}')" class="text-xs text-red-600 font-bold">Hapus</button></div></div>`).join('') || '<p class="text-xs text-slate-400">Belum ada data.</p>'}</div>
      </div>`;
    }

    function pLayanan() {
      return `<div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 fade-in">
        <div class="flex justify-between items-center mb-4"><h3 class="font-extrabold">Layanan (${state.layanan.length})</h3><button onclick="window.formLayanan()" class="px-4 py-2 rounded-xl bg-amber-500 text-white text-xs font-bold">+ Tambah</button></div>
        <div class="space-y-3">${state.layanan.map(l => `
          <div class="border border-slate-200 rounded-xl p-3 flex justify-between items-center"><div><div class="font-bold text-sm">${l.nama}</div><div class="text-xs text-slate-500">${l.jam}</div></div><button onclick="window.delDoc('layanan','${l.id}')" class="text-xs font-bold text-red-600">Hapus</button></div>`).join('') || '<p class="text-xs text-slate-400">Belum ada data.</p>'}</div>
      </div>`;
    }

    function pPotensi() {
      return `<div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 fade-in">
        <div class="flex justify-between items-center mb-4"><h3 class="font-extrabold">Potensi (${state.potensi.length})</h3><button onclick="window.formPotensi()" class="px-4 py-2 rounded-xl bg-amber-500 text-white text-xs font-bold">+ Tambah</button></div>
        <div class="space-y-3">${state.potensi.map(p => `
          <div class="border border-slate-200 rounded-xl p-3 flex justify-between items-center"><div><div class="font-bold text-sm">${p.judul} (${p.kategori})</div><div class="text-xs text-slate-500">${p.lokasi}</div></div><button onclick="window.delDoc('potensi','${p.id}')" class="text-xs font-bold text-red-600">Hapus</button></div>`).join('') || '<p class="text-xs text-slate-400">Belum ada data.</p>'}</div>
      </div>`;
    }

    function pAgenda() {
      return `<div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 fade-in">
        <div class="flex justify-between items-center mb-4"><h3 class="font-extrabold">Agenda & Pengumuman (${state.agenda.length})</h3><button onclick="window.formAgenda()" class="px-4 py-2 rounded-xl bg-amber-500 text-white text-xs font-bold">+ Tambah</button></div>
        <div class="space-y-3">${state.agenda.map(a => `
          <div class="border border-slate-200 rounded-xl p-3 flex justify-between items-center"><div><div class="font-bold text-sm">${a.judul}</div><div class="text-xs text-slate-500">${a.jenis} • ${a.jadwal}</div></div><button onclick="window.delDoc('agenda','${a.id}')" class="text-xs font-bold text-red-600">Hapus</button></div>`).join('') || '<p class="text-xs text-slate-400">Belum ada data.</p>'}</div>
      </div>`;
    }

    function pKontak() {
      const k = state.kontak;
      return `<div class="space-y-6 fade-in">
        <form onsubmit="window.saveSettings(event,'kontak')" class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-4">
          <h3 class="font-extrabold">Kontak Pengelola</h3>
          ${inp('k-al','Alamat',k.alamat)}
          <div class="grid md:grid-cols-3 gap-3">${inp('k-tlp','Telepon',k.telepon)} ${inp('k-wa','WhatsApp (628...)',k.whatsapp)} ${inp('k-em','Email',k.email)}</div>
          ${inp('k-jam','Jam Operasional',k.jam)}
          <button type="submit" class="px-6 py-2.5 rounded-xl bg-amber-500 text-white font-bold text-sm">Simpan Kontak</button>
        </form>
        <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
          <h3 class="font-extrabold mb-3">Kotak Masuk Pesan Warga (${state.pesanWarga.length})</h3>
          <div class="space-y-3">${state.pesanWarga.map(m => `
            <div class="border border-slate-200 rounded-xl p-3 flex justify-between gap-3">
              <div><div class="font-bold text-sm">${m.subjek} <span class="text-xs font-normal text-slate-400">(${m.tanggal})</span></div><div class="text-xs text-teal-700">${m.nama} - ${m.kontak}</div><p class="text-xs text-slate-600 mt-1">${m.pesan}</p></div>
              <button onclick="window.delDoc('pesan_warga','${m.id}')" class="text-xs font-bold text-red-600 self-start">Hapus</button>
            </div>`).join('') || '<p class="text-xs text-slate-400">Belum ada pesan warga.</p>'}</div>
        </div>
      </div>`;
    }

    window.saveSettings = async (e, key) => {
      e.preventDefault();
      let data = {};
      if (key === 'beranda') data = { nama: val('b-nama'), tagline: val('b-tagline'), domain: val('b-domain'), heroKecil: val('b-hk'), heroHighlight: val('b-hh'), heroImg: val('b-img'), heroSub: val('b-sub'), fb: val('b-fb'), ig: val('b-ig'), yt: val('b-yt') };
      if (key === 'profil') data = { ...state.profil, sejarah: val('p-sej'), visi: val('p-visi'), misi: val('p-misi').split('\n').filter(Boolean), stats: { penduduk: val('p-pend'), kk: val('p-kk'), rt: val('p-rt'), rw: val('p-rw') } };
      if (key === 'kontak') data = { alamat: val('k-al'), telepon: val('k-tlp'), whatsapp: val('k-wa'), email: val('k-em'), jam: val('k-jam') };
      await setDoc(doc(db, 'settings', key), data, { merge: true });
      toast('Tersimpan ke Firebase & tersinkron ke Web Utama!');
    };

    window.formBerita = (id) => {
      const b = id ? state.berita.find(x => x.id === id) : { judul: '', kategori: 'Kegiatan Warga', tanggal: new Date().toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}), gambar: '', ringkasan: '', isi: '', status: 'publish' };
      openModal(id ? 'Edit Berita' : 'Tambah Berita', `<form onsubmit="window.saveCol(event,'berita','${id||''}')" class="space-y-3">
        ${inp('f-judul','Judul',b.judul)} ${inp('f-kat','Kategori',b.kategori)} ${inp('f-tgl','Tanggal',b.tanggal)} ${inp('f-img','URL Gambar',b.gambar)}
        <select id="f-st" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm"><option value="publish" ${b.status!=='draft'?'selected':''}>Publish</option><option value="draft" ${b.status==='draft'?'selected':''}>Draft</option></select>
        <textarea id="f-rk" rows="2" required placeholder="Ringkasan" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm">${b.ringkasan}</textarea>
        <textarea id="f-isi" rows="4" required placeholder="Isi lengkap" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm">${b.isi}</textarea>
        <button type="submit" class="w-full py-2.5 rounded-xl bg-[#115E59] text-white font-bold text-sm">Simpan</button>
      </form>`);
    };
    window.formGaleri = () => openModal('Tambah Galeri', `<form onsubmit="window.saveCol(event,'galeri','')" class="space-y-3">${inp('g-j','Judul','')}${inp('g-k','Kategori','Kegiatan')}${inp('g-t','Tipe (Foto/Video)','Foto')}${inp('g-u','URL Gambar','')}<button type="submit" class="w-full py-2.5 rounded-xl bg-[#115E59] text-white font-bold text-sm">Simpan</button></form>`);
    window.formLayanan = () => openModal('Tambah Layanan', `<form onsubmit="window.saveCol(event,'layanan','')" class="space-y-3">${inp('l-n','Nama Layanan','')}${inp('l-d','Deskripsi','')}${inp('l-s','Syarat','')}${inp('l-p','Prosedur','')}${inp('l-j','Jam Layanan','')}${inp('l-w','WA (628...)','')}<button type="submit" class="w-full py-2.5 rounded-xl bg-[#115E59] text-white font-bold text-sm">Simpan</button></form>`);
    window.formPotensi = () => openModal('Tambah Potensi', `<form onsubmit="window.saveCol(event,'potensi','')" class="space-y-3">${inp('pt-k','Kategori (Pertanian/Wisata Alam/UMKM/Budaya)','UMKM')}${inp('pt-j','Judul','')}${inp('pt-s','Subjudul','')}${inp('pt-l','Lokasi','')}${inp('pt-i','URL Gambar','')}${inp('pt-d','Deskripsi','')}<button type="submit" class="w-full py-2.5 rounded-xl bg-[#115E59] text-white font-bold text-sm">Simpan</button></form>`);
    window.formAgenda = () => openModal('Tambah Agenda/Pengumuman', `<form onsubmit="window.saveCol(event,'agenda','')" class="space-y-3">${inp('a-jn','Jenis (Agenda/Pengumuman)','Pengumuman')}${inp('a-jd','Judul','')}${inp('a-jw','Jadwal/Waktu','')}${inp('a-lk','Lokasi','')}${inp('a-kt','Keterangan','')}<button type="submit" class="w-full py-2.5 rounded-xl bg-[#115E59] text-white font-bold text-sm">Simpan</button></form>`);

    window.saveCol = async (e, col, id) => {
      e.preventDefault();
      let payload = { createdAt: serverTimestamp() };
      if (col === 'berita') payload = { ...payload, judul: val('f-judul'), kategori: val('f-kat'), tanggal: val('f-tgl'), gambar: val('f-img'), status: val('f-st'), ringkasan: val('f-rk'), isi: val('f-isi'), views: 0 };
      if (col === 'galeri') payload = { ...payload, judul: val('g-j'), kategori: val('g-k'), tipe: val('g-t'), url: val('g-u'), tanggal: new Date().toLocaleDateString('id-ID') };
      if (col === 'layanan') payload = { ...payload, nama: val('l-n'), deskripsi: val('l-d'), syarat: val('l-s'), prosedur: val('l-p'), jam: val('l-j'), wa: val('l-w') };
      if (col === 'potensi') payload = { ...payload, kategori: val('pt-k'), judul: val('pt-j'), subjudul: val('pt-s'), lokasi: val('pt-l'), gambar: val('pt-i'), deskripsi: val('pt-d') };
      if (col === 'agenda') payload = { ...payload, jenis: val('a-jn'), judul: val('a-jd'), jadwal: val('a-jw'), lokasi: val('a-lk'), keterangan: val('a-kt') };

      if (id) await updateDoc(doc(db, col, id), payload);
      else await addDoc(collection(db, col), payload);
      window.closeModal();
      toast('Tersimpan & tersinkron ke Web Utama!');
    };

    window.delDoc = async (col, id) => {
      if (!confirm('Hapus data ini dari Firebase?')) return;
      await deleteDoc(doc(db, col, id));
      toast('Data dihapus dari Firebase!');
    };

    lucide.createIcons();
  </script>
</body>
</html>
