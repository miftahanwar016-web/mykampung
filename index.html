<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyKampung — Portal Informasi Kampung Kita</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F8FAFC; color: #0F172A; }
    .hero-gradient {
      background: linear-gradient(95deg, #0F5156 0%, rgba(15, 81, 86, 0.94) 38%, rgba(15, 81, 86, 0.55) 62%, rgba(15, 81, 86, 0.1) 100%);
    }
    @media (max-width: 768px) {
      .hero-gradient {
        background: linear-gradient(180deg, rgba(15, 81, 86, 0.92) 0%, rgba(15, 81, 86, 0.78) 65%, rgba(15, 81, 86, 0.92) 100%);
      }
    }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .fade-in { animation: fadeIn 0.25s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- TOP UTILITY BAR -->

      <div class="flex items-center gap-2 font-medium">
        <i data-lucide="sprout" class="w-4 h-4 text-lime-400"></i>
        <span id="top-domain">MyKampung.my.id | Portal Informasi Kampung Kita</span>
      </div>
      <div class="flex items-center gap-3 ml-auto">
        <div id="top-socials" class="hidden sm:flex items-center gap-1.5">

        </div>
      </div>
    </div>
  </div>

  <!-- STICKY MAIN NAVBAR -->

      <!-- Logo -->
      <button onclick="navigate('beranda')" class="flex items-center gap-2.5 text-left group shrink-0">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-600 to-teal-800 flex items-center justify-center text-white shadow-md group-hover:scale-105 transition">
          <i data-lucide="home" class="w-5 h-5"></i>
        </div>
        <div>
          <div class="text-xl font-extrabold leading-none tracking-tight">
            <span class="text-[#115E59]" id="brand-part1">My</span><span class="text-orange-600" id="brand-part2">Kampung</span>
          </div>
          <div class="text-[11px] text-slate-500 font-medium mt-0.5" id="brand-tagline">Portal Informasi Kampung</div>
        </div>
      </button>

      <!-- Desktop Menu -->
      <nav id="desktop-nav" class="hidden xl:flex items-center gap-1 text-sm font-semibold text-slate-700"></nav>

      <!-- Mobile Menu Button -->
      <button onclick="toggleMobileMenu()" class="xl:hidden p-2 rounded-xl text-slate-700 hover:bg-slate-100">
        <i data-lucide="menu" class="w-6 h-6"></i>
      </button>
    </div>

    <!-- Mobile Dropdown Nav -->
    <div id="mobile-nav" class="hidden xl:hidden bg-white border-t border-slate-100 px-4 py-3 space-y-1 shadow-lg"></div>
  </header>

  <!-- MAIN CONTENT CONTAINER -->
  <main id="app-content" class="flex-1"></main>

  <!-- FOOTER -->
  <footer class="bg-[#0B3F42] text-teal-100 mt-auto">
    <div class="max-w-7xl mx-auto px-4 lg:px-8 py-10 grid grid-cols-1 md:grid-cols-3 gap-8 text-sm">

        <div class="flex items-center gap-2 mb-3">

        </div>

          <button onclick="navigate('potensi')" class="text-left hover:text-amber-400 transition">Potensi Kampung</button>

    </div>
    <div class="border-t border-teal-800/80 py-4 text-center text-xs text-teal-300/80">

    </div>
  </footer>

  <!-- MODAL DETAIL -->
  <div id="detail-modal" class="fixed inset-0 z-50 hidden bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4" onclick="if(event.target===this) closeModal()">

    let db = {};
    let currentPage = 'beranda';

    function loadData() {
      const saved = localStorage.getItem(DB_KEY);
      if (!saved) {
        localStorage.setItem(DB_KEY, JSON.stringify(DEFAULT_DATA));
        db = JSON.parse(JSON.stringify(DEFAULT_DATA));
      } else {
        try {
          db = JSON.parse(saved);
        } catch {
          db = JSON.parse(JSON.stringify(DEFAULT_DATA));
        }
      }
    }

    function saveData() {
      localStorage.setItem(DB_KEY, JSON.stringify(db));
    }

    // Real-time Sync dari Web Admin (tab lain)
    window.addEventListener('storage', (e) => {
      if (e.key === DB_KEY) {
        loadData();
        renderHeaderFooter();
        renderPage(currentPage);
      }
    });

    const NAV_ITEMS = [
      { id: 'beranda', label: 'Beranda', icon: 'home' },
      { id: 'profil', label: 'Profil Kampung', icon: 'users' },
      { id: 'berita', label: 'Berita', icon: 'newspaper' },
      { id: 'galeri', label: 'Galeri', icon: 'images' },
      { id: 'layanan', label: 'Layanan', icon: 'clipboard-list' },
      { id: 'potensi', label: 'Potensi', icon: 'sprout' },
      { id: 'agenda', label: 'Agenda', icon: 'megaphone' },
      { id: 'kontak', label: 'Kontak', icon: 'mail' }
    ];

    function renderHeaderFooter() {
      const b = db.beranda;
      document.title = `${b.nama} — ${b.tagline}`;
      document.getElementById('top-domain').textContent = b.domain;
      document.getElementById('brand-tagline').textContent = b.tagline;
      document.getElementById('footer-brand').textContent = b.nama;
      document.getElementById('footer-copy').textContent = b.nama;
      document.getElementById('footer-desc').textContent = b.heroSub;

      // Split brand name visually if starts with "My"
      if (b.nama.toLowerCase().startsWith('my') && b.nama.length > 2) {
        document.getElementById('brand-part1').textContent = b.nama.slice(0, 2);
        document.getElementById('brand-part2').textContent = b.nama.slice(2);
      } else {
        document.getElementById('brand-part1').textContent = b.nama;
        document.getElementById('brand-part2').textContent = '';
      }

      document.getElementById('soc-fb').href = b.fb || '#';
      document.getElementById('soc-ig').href = b.ig || '#';
      document.getElementById('soc-yt').href = b.yt || '#';

      const k = db.kontak;
      document.getElementById('footer-kontak').innerHTML = `
        <p class="flex items-start gap-2"><i data-lucide="map-pin" class="w-4 h-4 shrink-0 text-amber-400 mt-0.5"></i><span>${k.alamat}</span></p>
        <p class="flex items-center gap-2"><i data-lucide="phone" class="w-4 h-4 shrink-0 text-amber-400"></i><span>${k.telepon}</span></p>
        <p class="flex items-center gap-2"><i data-lucide="mail" class="w-4 h-4 shrink-0 text-amber-400"></i><span>${k.email}</span></p>
      `;

      // Render Navigation
      const deskNav = document.getElementById('desktop-nav');
      const mobNav = document.getElementById('mobile-nav');
      deskNav.innerHTML = NAV_ITEMS.map(item => {
        const active = currentPage === item.id;
        return `<button onclick="navigate('${item.id}')" class="px-3.5 py-2 rounded-xl flex items-center gap-1.5 transition ${active ? 'bg-[#16695E] text-white shadow-sm' : 'text-slate-700 hover:bg-teal-50 hover:text-teal-800'}">
          <i data-lucide="${item.icon}" class="w-4 h-4"></i><span>${item.label}</span>
        </button>`;
      }).join('');

      mobNav.innerHTML = NAV_ITEMS.map(item => {
        const active = currentPage === item.id;
        return `<button onclick="navigate('${item.id}'); toggleMobileMenu(false)" class="w-full px-4 py-2.5 rounded-xl flex items-center gap-3 text-sm font-semibold transition ${active ? 'bg-[#16695E] text-white' : 'text-slate-700 hover:bg-slate-50'}">
          <i data-lucide="${item.icon}" class="w-4 h-4"></i><span>${item.label}</span>
        </button>`;
      }).join('');

      lucide.createIcons();
    }

    function toggleMobileMenu(force) {
      const el = document.getElementById('mobile-nav');
      if (typeof force === 'boolean') el.classList.toggle('hidden', !force);
      else el.classList.toggle('hidden');
    }

    function navigate(page) {
      currentPage = page;
      document.getElementById('global-search').value = '';
      renderHeaderFooter();
      renderPage(page);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderPage(page) {
      const container = document.getElementById('app-content');
      if (page === 'beranda') container.innerHTML = viewBeranda();
      else if (page === 'profil') container.innerHTML = viewProfil();
      else if (page === 'berita') container.innerHTML = viewBerita();
      else if (page === 'galeri') container.innerHTML = viewGaleri();
      else if (page === 'layanan') container.innerHTML = viewLayanan();
      else if (page === 'potensi') container.innerHTML = viewPotensi();
      else if (page === 'agenda') container.innerHTML = viewAgenda();
      else if (page === 'kontak') container.innerHTML = viewKontak();
      lucide.createIcons();
    }

                    <i data-lucide="${ag.jenis === 'Pengumuman' ? 'megaphone' : 'calendar-days'}" class="w-6 h-6"></i>
                  </div>
                  <div>
                    <span class="text-[11px] font-bold uppercase tracking-wider ${ag.jenis === 'Pengumuman' ? 'text-amber-600' : 'text-teal-700'}">${ag.jenis}</span>
                    <h3 class="text-base font-extrabold text-slate-900">${ag.judul}</h3>
                    <p class="text-xs text-slate-600 mt-1">${ag.keterangan}</p>
                    <div class="flex flex-wrap items-center gap-4 mt-2 text-xs text-slate-500">
                      <span class="flex items-center gap-1"><i data-lucide="clock" class="w-3.5 h-3.5 text-orange-500"></i> ${ag.jadwal}</span>
                      <span class="flex items-center gap-1"><i data-lucide="map-pin" class="w-3.5 h-3.5 text-teal-600"></i> ${ag.lokasi}</span>
                    </div>
                  </div>
                </div>
              </div>
            `).join('') || '<p class="text-slate-400">Belum ada agenda atau pengumuman.</p>'}
          </div>
        </div>
      `;
    }

    // ================= VIEW: KONTAK PENGELOLA =================
    function viewKontak() {
      const k = db.kontak;
      return `
        <div class="max-w-7xl mx-auto px-4 lg:px-8 py-10 fade-in">
          ${pageHeader('Kontak Pengelola', 'Sampaikan pertanyaan, saran, atau laporan warga langsung ke pengelola kampung.')}
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-7">
            <div class="lg:col-span-5 bg-white rounded-2xl p-6 shadow-sm border border-slate-100 space-y-5">
              <h3 class="text-lg font-extrabold text-[#115E59]">Informasi Balai Kampung</h3>
              <div class="space-y-4 text-sm text-slate-600">
                <div class="flex items-start gap-3"><i data-lucide="map-pin" class="w-5 h-5 text-orange-500 shrink-0 mt-0.5"></i><div><div class="font-bold text-slate-800">Alamat</div>${k.alamat}</div></div>
                <div class="flex items-start gap-3"><i data-lucide="phone" class="w-5 h-5 text-teal-600 shrink-0 mt-0.5"></i><div><div class="font-bold text-slate-800">Telepon</div>${k.telepon}</div></div>
                <div class="flex items-start gap-3"><i data-lucide="mail" class="w-5 h-5 text-sky-600 shrink-0 mt-0.5"></i><div><div class="font-bold text-slate-800">Email</div>${k.email}</div></div>
                <div class="flex items-start gap-3"><i data-lucide="clock" class="w-5 h-5 text-emerald-600 shrink-0 mt-0.5"></i><div><div class="font-bold text-slate-800">Jam Operasional</div>${k.jam}</div></div>
              </div>
              <a href="https://wa.me/${k.whatsapp}" target="_blank" class="w-full py-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm flex items-center justify-center gap-2 transition">
                <i data-lucide="message-circle" class="w-4 h-4"></i> Chat WhatsApp Pengelola
              </a>
            </div>
            <div class="lg:col-span-7 bg-white rounded-2xl p-6 shadow-sm border border-slate-100">
              <h3 class="text-lg font-extrabold text-slate-900 mb-4">Kirim Pesan / Aspirasi Warga</h3>
              <form onsubmit="kirimPesanWarga(event)" class="space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Nama Lengkap</label>
                    <input id="pw-nama" required type="text" placeholder="Contoh: Budi Santoso" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-teal-600" />
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">No. HP / WhatsApp</label>
                    <input id="pw-kontak" required type="text" placeholder="0812xxxxxxxx" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-teal-600" />
                  </div>
                </div>
                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1">Perihal / Subjek</label>
                  <input id="pw-subjek" required type="text" placeholder="Contoh: Usulan kegiatan / Pengaduan fasilitas" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-teal-600" />
                </div>
                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1">Isi Pesan</label>
                  <textarea id="pw-pesan" required rows="4" placeholder="Tuliskan pesan Anda di sini..." class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-teal-600"></textarea>
                </div>
                <button type="submit" class="px-6 py-2.5 rounded-full bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-400 hover:to-orange-500 text-white font-bold text-sm shadow transition">
                  Kirim Pesan ke Pengelola
                </button>
                <div id="pw-status" class="hidden text-xs font-semibold text-emerald-700 bg-emerald-50 border border-emerald-200 px-4 py-2.5 rounded-xl"></div>
              </form>
            </div>
          </div>
        </div>
      `;
    }

    function pageHeader(title, subtitle) {
      return `
        <div class="mb-8">
          <div class="flex items-center gap-2 text-xs font-semibold text-teal-700 mb-1">
            <button onclick="navigate('beranda')" class="hover:underline">Beranda</button> / <span>${title}</span>
          </div>
          <h1 class="text-2xl md:text-3xl font-extrabold text-slate-900">${title}</h1>
          <p class="text-sm text-slate-500 mt-1">${subtitle}</p>
        </div>
      `;
    }

    // ================= INTERACTIONS & MODALS =================
    function openBerita(id) {
      const item = db.berita.find(b => b.id === id);
      if (!item) return;
      item.views = (Number(item.views) || 0) + 1;
      saveData();

      document.getElementById('modal-badge').textContent = item.kategori;
      document.getElementById('modal-body').innerHTML = `
        <img src="${item.gambar}" alt="${item.judul}" class="w-full h-64 object-cover rounded-xl mb-5" />
        <h2 class="text-xl md:text-2xl font-extrabold text-slate-900 mb-2">${item.judul}</h2>
        <div class="flex items-center gap-4 text-xs text-slate-500 mb-5">
          <span>${item.tanggal}</span> • <span>${item.views.toLocaleString('id-ID')} kali dibaca</span>
        </div>
        <div class="text-sm text-slate-700 leading-relaxed whitespace-pre-line">${item.isi}</div>
      `;
      document.getElementById('detail-modal').classList.remove('hidden');
      renderPage(currentPage);
    }

    function openAgenda(id) {
      const ag = db.agenda.find(a => a.id === id);
      if (!ag) return;
      document.getElementById('modal-badge').textContent = ag.jenis;
      document.getElementById('modal-body').innerHTML = `
        <h2 class="text-xl font-extrabold text-slate-900 mb-3">${ag.judul}</h2>
        <div class="space-y-2 text-sm text-slate-600 bg-slate-50 p-4 rounded-xl mb-4">
          <div><strong>Waktu:</strong> ${ag.jadwal}</div>
          <div><strong>Lokasi:</strong> ${ag.lokasi}</div>
        </div>
        <p class="text-sm text-slate-700 leading-relaxed">${ag.keterangan}</p>
      `;
      document.getElementById('detail-modal').classList.remove('hidden');
    }

    function openGaleri(id) {
      const g = db.galeri.find(x => x.id === id);
      if (!g) return;
      document.getElementById('modal-badge').textContent = `${g.tipe} • ${g.kategori}`;
      document.getElementById('modal-body').innerHTML = `
        <img src="${g.url}" alt="${g.judul}" class="w-full max-h-[60vh] object-contain rounded-xl bg-slate-100 mb-4" />
        <h3 class="text-lg font-extrabold text-slate-900">${g.judul}</h3>
        <p class="text-xs text-slate-500 mt-1">Diunggah: ${g.tanggal}</p>
      `;
      document.getElementById('detail-modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('detail-modal').classList.add('hidden');
    }

    function kirimPesanWarga(e) {
      e.preventDefault();
      loadData();
      const newMsg = {
        id: Date.now(),
        nama: document.getElementById('pw-nama').value.trim(),
        kontak: document.getElementById('pw-kontak').value.trim(),
        subjek: document.getElementById('pw-subjek').value.trim(),
        pesan: document.getElementById('pw-pesan').value.trim(),
        tanggal: new Date().toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' })
      };
      db.pesanWarga.unshift(newMsg);
      saveData();
      e.target.reset();
      const st = document.getElementById('pw-status');
      st.textContent = 'Pesan Anda berhasil terkirim dan langsung masuk ke Panel Admin Pengelola!';
      st.classList.remove('hidden');
    }

    // Global Search
    document.getElementById('global-search').addEventListener('input', (e) => {
      const q = e.target.value.trim().toLowerCase();
      if (!q) { renderPage(currentPage); return; }
      const bRes = db.berita.filter(x => x.status !== 'draft' && (x.judul + x.ringkasan).toLowerCase().includes(q));
      const aRes = db.agenda.filter(x => (x.judul + x.keterangan).toLowerCase().includes(q));
      const lRes = db.layanan.filter(x => (x.nama + x.deskripsi).toLowerCase().includes(q));
      const pRes = db.potensi.filter(x => (x.judul + x.deskripsi).toLowerCase().includes(q));

      const container = document.getElementById('app-content');
      container.innerHTML = `
        <div class="max-w-7xl mx-auto px-4 lg:px-8 py-10 fade-in">
          <h2 class="text-xl font-extrabold text-slate-900 mb-6">Hasil Pencarian: "<span class="text-[#115E59]">${q}</span>"</h2>
          <div class="space-y-6">
            ${bRes.length ? `<div><h3 class="font-bold text-sm text-teal-800 mb-2">Berita (${bRes.length})</h3><div class="grid sm:grid-cols-2 gap-3">${bRes.map(x => `<div onclick="openBerita(${x.id})" class="bg-white p-4 rounded-xl border border-slate-100 cursor-pointer hover:shadow"><div class="font-bold text-sm">${x.judul}</div><div class="text-xs text-slate-500 mt-1">${x.tanggal}</div></div>`).join('')}</div></div>` : ''}
            ${aRes.length ? `<div><h3 class="font-bold text-sm text-teal-800 mb-2">Agenda & Pengumuman (${aRes.length})</h3><div class="grid sm:grid-cols-2 gap-3">${aRes.map(x => `<div onclick="openAgenda(${x.id})" class="bg-white p-4 rounded-xl border border-slate-100 cursor-pointer hover:shadow"><div class="font-bold text-sm">${x.judul}</div><div class="text-xs text-slate-500 mt-1">${x.jadwal}</div></div>`).join('')}</div></div>` : ''}
            ${lRes.length ? `<div><h3 class="font-bold text-sm text-teal-800 mb-2">Layanan (${lRes.length})</h3><div class="grid sm:grid-cols-2 gap-3">${lRes.map(x => `<div onclick="navigate('layanan')" class="bg-white p-4 rounded-xl border border-slate-100 cursor-pointer hover:shadow"><div class="font-bold text-sm">${x.nama}</div><div class="text-xs text-slate-500 mt-1">${x.jam}</div></div>`).join('')}</div></div>` : ''}
            ${pRes.length ? `<div><h3 class="font-bold text-sm text-teal-800 mb-2">Potensi (${pRes.length})</h3><div class="grid sm:grid-cols-2 gap-3">${pRes.map(x => `<div onclick="navigate('potensi')" class="bg-white p-4 rounded-xl border border-slate-100 cursor-pointer hover:shadow"><div class="font-bold text-sm">${x.judul}</div><div class="text-xs text-slate-500 mt-1">${x.kategori}</div></div>`).join('')}</div></div>` : ''}
            ${(!bRes.length && !aRes.length && !lRes.length && !pRes.length) ? '<div class="bg-white p-8 rounded-2xl text-center text-slate-400">Tidak ditemukan informasi yang cocok.</div>' : ''}
          </div>
        </div>
      `;
    });

    // Init
    loadData();
    renderHeaderFooter();
    renderPage('beranda');
  </script>
</body>
</html>
