<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#115E59" />
  <title>Kampung Panyingkiran — Portal Informasi Kampung</title>
  <link rel="manifest" href='data:application/manifest+json,{"name":"Kampung Panyingkiran","short_name":"Panyingkiran","start_url":".","display":"standalone","background_color":"#F8FAFC","theme_color":"#115E59","icons":[{"src":"https://ui-avatars.com/api/?name=KP&background=115E59&color=fff&size=192","sizes":"192x192","type":"image/png"}]}' />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F8FAFC; color: #0F172A; padding-bottom: 70px; }
    @media (min-width: 1024px) { body { padding-bottom: 0; } }
    .hero-gradient { background: linear-gradient(95deg, #0F5156 0%, rgba(15,81,86,0.92) 38%, rgba(15,81,86,0.5) 65%, rgba(15,81,86,0.1) 100%); }
    @media (max-width: 768px) { .hero-gradient { background: linear-gradient(180deg, rgba(15,81,86,0.92) 0%, rgba(15,81,86,0.78) 60%, rgba(15,81,86,0.94) 100%); } }
    .glass { background: rgba(255,255,255,0.88); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .fade-in { animation: fadeIn 0.25s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- TOP UTILITY BAR -->
  <div class="bg-[#115E59] text-white text-xs py-2 border-b border-teal-700/50">
    <div class="max-w-7xl mx-auto px-4 lg:px-8 flex flex-wrap items-center justify-between gap-2">
      <div class="flex items-center gap-2 font-medium">
        <i data-lucide="sprout" class="w-4 h-4 text-lime-400"></i>
        <span id="top-domain">Kampung Panyingkiran | Portal Informasi Kampung Kita</span>
      </div>
      <div class="flex items-center gap-3 ml-auto">
        <div class="hidden sm:flex items-center gap-1.5">
          <a href="#" id="soc-fb" target="_blank" class="w-6 h-6 rounded-full bg-white/15 hover:bg-blue-600 flex items-center justify-center transition"><i data-lucide="facebook" class="w-3.5 h-3.5"></i></a>
          <a href="#" id="soc-ig" target="_blank" class="w-6 h-6 rounded-full bg-white/15 hover:bg-pink-600 flex items-center justify-center transition"><i data-lucide="instagram" class="w-3.5 h-3.5"></i></a>
          <a href="#" id="soc-yt" target="_blank" class="w-6 h-6 rounded-full bg-white/15 hover:bg-red-600 flex items-center justify-center transition"><i data-lucide="youtube" class="w-3.5 h-3.5"></i></a>
        </div>
        <div class="relative">
          <input id="global-search" type="text" placeholder="Cari informasi.." class="bg-white text-slate-700 rounded-full pl-3.5 pr-8 py-1 text-xs w-44 sm:w-56 focus:outline-none focus:ring-2 focus:ring-amber-400" />
          <i data-lucide="search" class="w-3.5 h-3.5 text-slate-400 absolute right-2.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
        </div>
      </div>
    </div>
  </div>

  <!-- STICKY NAVBAR -->
  <header class="glass sticky top-0 z-40 shadow-sm border-b border-slate-100">
    <div class="max-w-7xl mx-auto px-4 lg:px-8 py-3 flex items-center justify-between gap-4">
      <button onclick="window.navigate('beranda')" class="flex items-center gap-2.5 text-left shrink-0">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-600 to-teal-800 flex items-center justify-center text-white shadow-md">
          <i data-lucide="home" class="w-5 h-5"></i>
        </div>
        <div>
          <div class="text-xl font-extrabold leading-none tracking-tight">
            <span class="text-[#115E59]" id="brand-p1">Kampung </span><span class="text-orange-600" id="brand-p2">Panyingkiran</span>
          </div>
          <div class="text-[11px] text-slate-500 font-medium mt-0.5" id="brand-tagline">Portal Informasi Kampung</div>
        </div>
      </button>
      <nav id="desktop-nav" class="hidden lg:flex items-center gap-1 text-sm font-semibold text-slate-700"></nav>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main id="app-content" class="flex-1">
    <div class="max-w-7xl mx-auto px-4 py-16 text-center text-slate-400 text-sm">Menghubungkan ke Firebase...</div>
  </main>

  <!-- FOOTER -->
  <footer class="bg-[#0B3F42] text-teal-100 mt-auto">
    <div class="max-w-7xl mx-auto px-4 lg:px-8 py-8 text-center text-xs">
      &copy; 2026 <strong id="footer-copy" class="text-white">Kampung Panyingkiran</strong>. <span id="footer-sub">Portal Informasi Warga.</span>
    </div>
  </footer>

  <!-- MOBILE BOTTOM NAVIGATION BAR -->
  <nav id="mobile-bottom-nav" class="lg:hidden fixed bottom-0 inset-x-0 z-40 glass border-t border-slate-200 px-2 py-1.5 flex items-center justify-around shadow-lg"></nav>

  <!-- MODAL DETAIL -->
  <div id="detail-modal" class="fixed inset-0 z-50 hidden bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4" onclick="if(event.target===this) window.closeModal()">
    <div class="bg-white rounded-2xl max-w-2xl w-full max-h-[88vh] overflow-y-auto shadow-2xl fade-in">
      <div class="sticky top-0 bg-white/95 backdrop-blur px-6 py-4 border-b border-slate-100 flex items-center justify-between">
        <span id="modal-badge" class="text-xs font-bold px-3 py-1 rounded-full bg-teal-50 text-teal-700">Detail</span>
        <button onclick="window.closeModal()" class="p-1.5 rounded-full hover:bg-slate-100 text-slate-500"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div id="modal-body" class="p-6"></div>
    </div>
  </div>

  <script type="module">
    const IS_PREVIEW = false;

    const firebaseConfig = {
      apiKey: "AIzaSyByGQOGJsgAujxq9lkEJ4UgCOMW824mF24",
      authDomain: "juragankos-aab60.firebaseapp.com",
      databaseURL: "https://juragankos-aab60-default-rtdb.firebaseio.com",
      projectId: "juragankos-aab60",
      storageBucket: "juragankos-aab60.firebasestorage.app",
      messagingSenderId: "993946963863",
      appId: "1:993946963863:web:ce5e709d12294898ad7ed2",
      measurementId: "G-CNYLS85FPR"
    };

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js";
    import { getFirestore, doc, collection, onSnapshot, addDoc, updateDoc, increment, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      const swCode = `self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));`;
      const swUrl = URL.createObjectURL(new Blob([swCode], { type: 'application/javascript' }));
      navigator.serviceWorker.register(swUrl).catch(() => {});
    }

    const app = initializeApp(firebaseConfig);
    try { getAnalytics(app); } catch {}
    const db = getFirestore(app);

    let currentPage = 'beranda';
    const state = {
      beranda: {
        nama: 'Kampung Panyingkiran',
        domain: 'Kampung Panyingkiran | Portal Informasi Kampung Kita',
        tagline: 'Portal Informasi Kampung',
        footerSub: 'Portal Informasi Warga.',
        heroKecil: 'Kampung Panyingkiran',
        heroHighlight: 'Kampung yang Asri, Guyub, dan Berdaya',
        heroSub: 'Informasi, kegiatan, layanan, dan potensi kampung dalam satu portal.',
        heroImg: 'https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=1600&q=80',
        fb: '#', ig: '#', yt: '#',
        menuBeranda: 'Beranda',
        menuProfil: 'Profil Kampung',
        menuBerita: 'Berita',
        menuGaleri: 'Galeri',
        menuLayanan: 'Layanan',
        menuPotensi: 'Potensi',
        menuAgenda: 'Agenda',
        menuKontak: 'Kontak',
        secBerita: 'Berita Terbaru',
        secPengumuman: 'Pengumuman',
        secPotensi: 'Potensi Unggulan Kampung'
      },
      profil: { sejarah: '', visi: '', misi: [], stats: { penduduk: '0', kk: '0', rt: '0', rw: '0' }, perangkat: [] },
      kontak: { alamat: '-', telepon: '-', whatsapp: '', email: '-', jam: '-' },
      berita: [], galeri: [], layanan: [], potensi: [], agenda: []
    };

    function getNavItems() {
      const b = state.beranda;
      return [
        { id: 'beranda', label: b.menuBeranda || 'Beranda', icon: 'home', mobile: true },
        { id: 'profil', label: b.menuProfil || 'Profil Kampung', icon: 'users', mobile: false },
        { id: 'berita', label: b.menuBerita || 'Berita', icon: 'newspaper', mobile: true },
        { id: 'galeri', label: b.menuGaleri || 'Galeri', icon: 'images', mobile: false },
        { id: 'layanan', label: b.menuLayanan || 'Layanan', icon: 'clipboard-list', mobile: true },
        { id: 'potensi', label: b.menuPotensi || 'Potensi', icon: 'sprout', mobile: false },
        { id: 'agenda', label: b.menuAgenda || 'Agenda', icon: 'megaphone', mobile: true },
        { id: 'kontak', label: b.menuKontak || 'Kontak', icon: 'mail', mobile: true }
      ];
    }

    function initApp() {
      onSnapshot(doc(db, 'settings', 'beranda'), snap => {
        if (snap.exists()) state.beranda = { ...state.beranda, ...snap.data() };
        renderAll();
      });
      onSnapshot(doc(db, 'settings', 'profil'), snap => {
        if (snap.exists()) state.profil = { ...state.profil, ...snap.data() };
        renderAll();
      });
      onSnapshot(doc(db, 'settings', 'kontak'), snap => {
        if (snap.exists()) state.kontak = { ...state.kontak, ...snap.data() };
        renderAll();
      });

      const bindCol = (colName, key) => {
        onSnapshot(query(collection(db, colName), orderBy('createdAt', 'desc')), snap => {
          state[key] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          renderAll();
        }, () => {
          onSnapshot(collection(db, colName), snap => {
            state[key] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            renderAll();
          });
        });
      };
      bindCol('berita', 'berita');
      bindCol('galeri', 'galeri');
      bindCol('layanan', 'layanan');
      bindCol('potensi', 'potensi');
      bindCol('agenda', 'agenda');
      renderAll();
    }

    function renderAll() {
      const b = state.beranda;
      const nama = b.nama || 'Kampung Panyingkiran';
      document.title = `${nama} — ${b.tagline || 'Portal Informasi Kampung'}`;
      document.getElementById('top-domain').textContent = b.domain || nama;
      document.getElementById('brand-tagline').textContent = b.tagline || '';
      document.getElementById('footer-copy').textContent = nama;
      document.getElementById('footer-sub').textContent = b.footerSub || 'Portal Informasi Warga.';

      // Bagi 2 warna logo secara otomatis berdasarkan spasi (misal: "Kampung" + "Panyingkiran")
      const parts = nama.trim().split(/\s+/);
      if (parts.length > 1) {
        document.getElementById('brand-p1').textContent = parts[0] + ' ';
        document.getElementById('brand-p2').textContent = parts.slice(1).join(' ');
      } else {
        document.getElementById('brand-p1').textContent = nama;
        document.getElementById('brand-p2').textContent = '';
      }

      document.getElementById('soc-fb').href = b.fb || '#';
      document.getElementById('soc-ig').href = b.ig || '#';
      document.getElementById('soc-yt').href = b.yt || '#';

      const navItems = getNavItems();
      document.getElementById('desktop-nav').innerHTML = navItems.map(item => `
        <button onclick="window.navigate('${item.id}')" class="px-3.5 py-2 rounded-xl flex items-center gap-1.5 transition ${currentPage===item.id ? 'bg-[#16695E] text-white shadow-sm' : 'text-slate-700 hover:bg-teal-50 hover:text-teal-800'}">
          <i data-lucide="${item.icon}" class="w-4 h-4"></i><span>${item.label}</span>
        </button>`).join('');

      document.getElementById('mobile-bottom-nav').innerHTML = navItems.filter(i => i.mobile).map(item => `
        <button onclick="window.navigate('${item.id}')" class="flex flex-col items-center gap-0.5 px-2 py-1 rounded-xl text-[10px] font-bold transition ${currentPage===item.id ? 'text-[#115E59] bg-teal-50' : 'text-slate-500'}">
          <i data-lucide="${item.icon}" class="w-5 h-5"></i><span>${item.label}</span>
        </button>`).join('');

      const c = document.getElementById('app-content');
      if (currentPage === 'beranda') c.innerHTML = viewBeranda();
      else if (currentPage === 'profil') c.innerHTML = viewProfil();
      else if (currentPage === 'berita') c.innerHTML = viewBerita();
      else if (currentPage === 'galeri') c.innerHTML = viewGaleri();
      else if (currentPage === 'layanan') c.innerHTML = viewLayanan();
      else if (currentPage === 'potensi') c.innerHTML = viewPotensi();
      else if (currentPage === 'agenda') c.innerHTML = viewAgenda();
      else if (currentPage === 'kontak') c.innerHTML = viewKontak();
      lucide.createIcons();
    }

    function viewBeranda() {
      const b = state.beranda;
      const pub = state.berita.filter(x => x.status !== 'draft');
      const feat = pub[0];
      const side = pub.slice(1, 4);
      const ags = state.agenda.slice(0, 3);
      const pots = state.potensi.slice(0, 4);
      const pIcons = { 'Pertanian': 'wheat', 'Wisata Alam': 'mountain', 'UMKM': 'store', 'Budaya': 'sparkles' };

      return `
        <div class="fade-in">
          <section class="relative min-h-[380px] md:min-h-[440px] flex items-center overflow-hidden">
            <img src="${b.heroImg}" class="absolute inset-0 w-full h-full object-cover" />
            <div class="absolute inset-0 hero-gradient"></div>
            <div class="relative z-10 max-w-7xl mx-auto px-4 lg:px-8 py-14 pb-24 w-full">
              <div class="max-w-xl text-white">
                <p class="text-xl md:text-2xl font-bold mb-1">${b.heroKecil}</p>
                <h1 class="text-3xl md:text-5xl font-extrabold text-[#FACC15] leading-tight mb-4">${b.heroHighlight}</h1>
                <p class="text-sm md:text-base text-teal-50/95 mb-7 max-w-lg">${b.heroSub}</p>
                <div class="flex flex-wrap gap-3">
                  <button onclick="window.navigate('potensi')" class="px-6 py-2.5 rounded-full bg-gradient-to-r from-amber-500 to-orange-600 text-white font-bold text-sm shadow-lg flex items-center gap-2">Jelajahi Sekarang <i data-lucide="arrow-right" class="w-4 h-4"></i></button>
                  <button onclick="window.navigate('profil')" class="px-6 py-2.5 rounded-full border border-white/75 bg-white/10 backdrop-blur-sm text-white font-semibold text-sm flex items-center gap-2"><i data-lucide="play-circle" class="w-4 h-4"></i> ${b.menuProfil || 'Profil Kampung'}</button>
                </div>
              </div>
            </div>
          </section>

          <section class="max-w-7xl mx-auto px-4 lg:px-8 -mt-12 relative z-20">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
              ${qCard('profil','bg-violet-600','users', b.menuProfil || 'Profil Kampung','Sejarah, budaya, dan kehidupan warga')}
              ${qCard('berita','bg-sky-600','newspaper', b.menuBerita || 'Berita','Kabar terbaru & agenda kegiatan')}
              ${qCard('galeri','bg-pink-500','image', b.menuGaleri || 'Galeri','Foto & video aktivitas warga')}
              ${qCard('layanan','bg-amber-500','clipboard-list', b.menuLayanan || 'Layanan','Informasi & layanan untuk warga')}
              ${qCard('potensi','bg-lime-600','sprout', b.menuPotensi || 'Potensi','Wisata, UMKM, pertanian, dan lainnya')}
            </div>
          </section>

          <section class="max-w-7xl mx-auto px-4 lg:px-8 py-12">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-7 items-start">
              <div class="lg:col-span-8">
                <div class="flex items-center justify-between mb-5">
                  <h2 class="text-xl md:text-2xl font-extrabold flex items-center gap-2"><i data-lucide="leaf" class="w-6 h-6 text-emerald-600"></i> ${b.secBerita || 'Berita Terbaru'}</h2>
                  <button onclick="window.navigate('berita')" class="text-sm font-bold text-[#115E59] hover:text-orange-600">Lihat Semua &rarr;</button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-12 gap-5">
                  <div class="md:col-span-7">
                    ${feat ? `
                      <article onclick="window.openBerita('${feat.id}')" class="bg-white rounded-2xl shadow-sm hover:shadow-lg border border-slate-100 overflow-hidden cursor-pointer transition">
                        <img src="${feat.gambar}" class="w-full h-56 object-cover" />
                        <div class="p-5">
                          <span class="-mt-9 mb-3 relative z-10 inline-block px-3.5 py-1 rounded-full bg-emerald-600 text-white text-xs font-bold shadow">${feat.kategori}</span>
                          <h3 class="text-lg font-extrabold text-slate-900 mb-2">${feat.judul}</h3>
                          <p class="text-xs text-slate-600 line-clamp-2 mb-4">${feat.ringkasan}</p>
                          <div class="flex items-center gap-4 text-xs text-slate-500 pt-3 border-t border-slate-100">
                            <span class="flex items-center gap-1"><i data-lucide="calendar" class="w-3.5 h-3.5"></i> ${feat.tanggal}</span>
                            <span class="flex items-center gap-1"><i data-lucide="eye" class="w-3.5 h-3.5"></i> ${Number(feat.views||0).toLocaleString('id-ID')}</span>
                          </div>
                        </div>
                      </article>` : '<div class="bg-white p-8 rounded-2xl text-center text-slate-400 text-sm">Belum ada berita dipublikasikan.</div>'}
                  </div>
                  <div class="md:col-span-5 flex flex-col gap-3.5">
                    ${side.map(item => `
                      <article onclick="window.openBerita('${item.id}')" class="bg-white rounded-2xl p-2.5 shadow-sm hover:shadow-md border border-slate-100 flex gap-3 items-center cursor-pointer transition">
                        <img src="${item.gambar}" class="w-24 h-20 object-cover rounded-xl shrink-0" />
                        <div class="min-w-0">
                          <h4 class="text-sm font-bold text-slate-800 line-clamp-2 mb-1">${item.judul}</h4>
                          <div class="text-xs text-slate-500">${item.tanggal}</div>
                        </div>
                      </article>`).join('')}
                  </div>
                </div>
              </div>

              <div class="lg:col-span-4">
                <div class="bg-white rounded-2xl shadow-md border border-slate-100 overflow-hidden">
                  <div class="bg-[#135D56] px-5 py-3.5 flex items-center justify-between text-white">
                    <div class="flex items-center gap-2 font-bold"><i data-lucide="megaphone" class="w-5 h-5 text-amber-400"></i> ${b.secPengumuman || 'Pengumuman'}</div>
                    <button onclick="window.navigate('agenda')" class="text-xs text-teal-100 hover:text-amber-300">Semua &rarr;</button>
                  </div>
                  <div class="divide-y divide-slate-100">
                    ${ags.map(ag => `
                      <button onclick="window.openAgenda('${ag.id}')" class="w-full text-left px-5 py-4 hover:bg-slate-50 flex items-center gap-3 transition">
                        <div class="w-10 h-10 rounded-xl bg-amber-50 text-amber-500 flex items-center justify-center shrink-0"><i data-lucide="bell" class="w-5 h-5"></i></div>
                        <div class="flex-1 min-w-0">
                          <div class="text-sm font-bold text-slate-800 truncate">${ag.judul}</div>
                          <div class="text-xs text-slate-500 truncate">${ag.jadwal}</div>
                        </div>
                        <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400"></i>
                      </button>`).join('') || '<div class="p-6 text-center text-xs text-slate-400">Belum ada pengumuman.</div>'}
                  </div>
                </div>
              </div>
            </div>
          </section>

          <section class="relative mt-4">
            <svg viewBox="0 0 1440 70" fill="none" class="w-full h-10 md:h-16 block -mb-1"><path d="M0 32C240 0 480 0 720 32C960 64 1200 64 1440 24V70H0V32Z" fill="#115E59"/></svg>
            <div class="bg-[#115E59] text-white pt-4 pb-12">
              <div class="max-w-7xl mx-auto px-4 lg:px-8">
                <h2 class="text-xl md:text-2xl font-extrabold flex items-center gap-2 mb-7"><i data-lucide="sprout" class="w-6 h-6 text-lime-400"></i> ${b.secPotensi || 'Potensi Unggulan Kampung'}</h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                  ${pots.map(p => `
                    <div onclick="window.navigate('potensi')" class="flex items-center gap-4 p-3 rounded-2xl hover:bg-white/10 cursor-pointer transition">
                      <div class="w-14 h-14 rounded-full bg-white text-teal-700 shadow-md flex items-center justify-center shrink-0"><i data-lucide="${pIcons[p.kategori]||'star'}" class="w-7 h-7"></i></div>
                      <div><h3 class="font-bold text-base">${p.judul}</h3><p class="text-xs text-teal-100/90">${p.subjudul||p.kategori}</p></div>
                    </div>`).join('') || '<p class="text-xs text-teal-200">Belum ada data potensi.</p>'}
                </div>
              </div>
            </div>
          </section>
        </div>`;
    }

    function qCard(t, bg, ic, title, desc) {
      return `<button onclick="window.navigate('${t}')" class="bg-white rounded-2xl p-4 shadow-md hover:shadow-lg border border-slate-100 flex items-center gap-3 text-left hover:-translate-y-1 transition">
        <div class="w-12 h-12 rounded-xl ${bg} text-white flex items-center justify-center shrink-0"><i data-lucide="${ic}" class="w-6 h-6"></i></div>
        <div class="min-w-0"><div class="text-sm font-extrabold text-slate-900 truncate">${title}</div><div class="text-[11px] text-slate-500 line-clamp-2">${desc}</div></div>
      </button>`;
    }

    function viewProfil() {
      const p = state.profil;
      return `<div class="max-w-7xl mx-auto px-4 lg:px-8 py-10 fade-in">
        <h1 class="text-2xl font-extrabold mb-6">${state.beranda.menuProfil || 'Profil Kampung'}</h1>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
          ${[['Penduduk', p.stats?.penduduk||'0'],['Kepala Keluarga', p.stats?.kk||'0'],['RT', p.stats?.rt||'0'],['RW', p.stats?.rw||'0']].map(x => `<div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100"><div class="text-2xl font-extrabold text-[#115E59]">${x[1]}</div><div class="text-xs text-slate-500">${x[0]}</div></div>`).join('')}
        </div>
        <div class="grid md:grid-cols-2 gap-6 mb-8">
          <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100"><h3 class="font-extrabold text-[#115E59] mb-2">Sejarah Kampung</h3><p class="text-sm text-slate-600 whitespace-pre-line">${p.sejarah || 'Belum ada data sejarah.'}</p></div>
          <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100"><h3 class="font-extrabold text-[#115E59] mb-2">Visi & Misi</h3><p class="text-sm font-bold text-teal-900 bg-teal-50 p-3 rounded-xl mb-3">${p.visi || '-'}</p><ul class="list-disc pl-5 text-sm text-slate-600 space-y-1">${(p.misi||[]).map(m => `<li>${m}</li>`).join('')}</ul></div>
        </div>
      </div>`;
    }

    function viewBerita() {
      const list = state.berita.filter(x => x.status !== 'draft');
      return `<div class="max-w-7xl mx-auto px-4 lg:px-8 py-10 fade-in">
        <h1 class="text-2xl font-extrabold mb-6">${state.beranda.menuBerita || 'Berita'}</h1>
        <div class="grid md:grid-cols-3 gap-6">${list.map(b => `
          <article onclick="window.openBerita('${b.id}')" class="bg-white rounded-2xl shadow-sm hover:shadow-lg border border-slate-100 overflow-hidden cursor-pointer transition">
            <img src="${b.gambar}" class="w-full h-44 object-cover" />
            <div class="p-5"><span class="text-xs font-bold text-emerald-700 bg-emerald-50 px-2.5 py-0.5 rounded-full">${b.kategori}</span><h3 class="font-extrabold mt-2 mb-1.5">${b.judul}</h3><p class="text-xs text-slate-600 line-clamp-2 mb-3">${b.ringkasan}</p><div class="text-xs text-slate-400">${b.tanggal} • ${b.views||0} dibaca</div></div>
          </article>`).join('') || '<p class="text-slate-400 text-sm">Belum ada berita.</p>'}</div>
      </div>`;
    }

    function viewGaleri() {
      return `<div class="max-w-7xl mx-auto px-4 lg:px-8 py-10 fade-in">
        <h1 class="text-2xl font-extrabold mb-6">${state.beranda.menuGaleri || 'Galeri'}</h1>
        <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-5">${state.galeri.map(g => `
          <div class="bg-white rounded-2xl overflow-hidden shadow-sm border border-slate-100"><img src="${g.url}" class="w-full h-44 object-cover" /><div class="p-4"><div class="text-xs font-bold text-teal-700">${g.kategori} (${g.tipe})</div><div class="font-bold text-sm mt-0.5">${g.judul}</div></div></div>`).join('') || '<p class="text-slate-400 text-sm">Belum ada galeri.</p>'}</div>
      </div>`;
    }

    function viewLayanan() {
      return `<div class="max-w-7xl mx-auto px-4 lg:px-8 py-10 fade-in">
        <h1 class="text-2xl font-extrabold mb-6">${state.beranda.menuLayanan || 'Layanan'}</h1>
        <div class="grid md:grid-cols-3 gap-6">${state.layanan.map(l => `
          <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 flex flex-col">
            <h3 class="font-extrabold text-lg mb-2">${l.nama}</h3>
            <p class="text-xs text-slate-600 mb-3">${l.deskripsi}</p>
            <div class="text-xs bg-slate-50 p-3 rounded-xl space-y-1.5 mb-4 flex-1">
              <div><strong>Syarat:</strong> ${l.syarat}</div><div><strong>Prosedur:</strong> ${l.prosedur}</div><div><strong>Jam:</strong> ${l.jam}</div>
            </div>
            <a href="https://wa.me/${l.wa}?text=${encodeURIComponent('Halo, saya butuh info layanan: '+l.nama)}" target="_blank" class="py-2.5 rounded-xl bg-[#115E59] text-white text-xs font-bold text-center">Hubungi via WhatsApp</a>
          </div>`).join('') || '<p class="text-slate-400 text-sm">Belum ada layanan.</p>'}</div>
      </div>`;
    }

    function viewPotensi() {
      return `<div class="max-w-7xl mx-auto px-4 lg:px-8 py-10 fade-in">
        <h1 class="text-2xl font-extrabold mb-6">${state.beranda.menuPotensi || 'Potensi'}</h1>
        <div class="grid md:grid-cols-2 gap-6">${state.potensi.map(p => `
          <div class="bg-white rounded-2xl overflow-hidden shadow-sm border border-slate-100 flex flex-col sm:flex-row">
            <img src="${p.gambar}" class="sm:w-44 h-44 sm:h-auto object-cover" />
            <div class="p-5"><span class="text-xs font-bold text-teal-700 bg-teal-50 px-2.5 py-0.5 rounded-full">${p.kategori}</span><h3 class="font-extrabold text-lg mt-2">${p.judul}</h3><p class="text-xs text-slate-600 my-2">${p.deskripsi}</p><div class="text-xs text-slate-500">Lokasi: ${p.lokasi}</div></div>
          </div>`).join('') || '<p class="text-slate-400 text-sm">Belum ada data potensi.</p>'}</div>
      </div>`;
    }

    function viewAgenda() {
      return `<div class="max-w-7xl mx-auto px-4 lg:px-8 py-10 fade-in">
        <h1 class="text-2xl font-extrabold mb-6">${state.beranda.menuAgenda || 'Agenda & Pengumuman'}</h1>
        <div class="space-y-4">${state.agenda.map(a => `
          <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
            <span class="text-[11px] font-bold uppercase text-amber-600">${a.jenis}</span>
            <h3 class="font-extrabold text-base mt-0.5">${a.judul}</h3>
            <p class="text-xs text-slate-600 mt-1">${a.keterangan}</p>
            <div class="text-xs text-slate-500 mt-2">${a.jadwal} • ${a.lokasi}</div>
          </div>`).join('') || '<p class="text-slate-400 text-sm">Belum ada agenda.</p>'}</div>
      </div>`;
    }

    function viewKontak() {
      const k = state.kontak;
      return `<div class="max-w-7xl mx-auto px-4 lg:px-8 py-10 fade-in">
        <h1 class="text-2xl font-extrabold mb-6">${state.beranda.menuKontak || 'Kontak Pengelola'}</h1>
        <div class="grid lg:grid-cols-12 gap-6">
          <div class="lg:col-span-5 bg-white rounded-2xl p-6 shadow-sm border border-slate-100 space-y-3 text-sm">
            <div><strong>Alamat:</strong> ${k.alamat}</div><div><strong>Telepon:</strong> ${k.telepon}</div><div><strong>Email:</strong> ${k.email}</div><div><strong>Jam:</strong> ${k.jam}</div>
          </div>
          <div class="lg:col-span-7 bg-white rounded-2xl p-6 shadow-sm border border-slate-100">
            <h3 class="font-extrabold mb-4">Kirim Pesan / Aspirasi Warga</h3>
            <form onsubmit="window.kirimPesan(event)" class="space-y-3">
              <div class="grid sm:grid-cols-2 gap-3">
                <input id="pw-nama" required placeholder="Nama Lengkap" class="px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm" />
                <input id="pw-kontak" required placeholder="No. HP / WA" class="px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm" />
              </div>
              <input id="pw-subjek" required placeholder="Subjek / Perihal" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm" />
              <textarea id="pw-pesan" required rows="3" placeholder="Tulis pesan Anda..." class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm"></textarea>
              <button type="submit" class="px-6 py-2.5 rounded-full bg-amber-500 text-white font-bold text-sm">Kirim Pesan</button>
              <div id="pw-ok" class="hidden text-xs font-bold text-emerald-700 bg-emerald-50 p-3 rounded-xl"></div>
            </form>
          </div>
        </div>
      </div>`;
    }

    window.navigate = (page) => { currentPage = page; renderAll(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
    window.closeModal = () => document.getElementById('detail-modal').classList.add('hidden');
    window.openBerita = async (id) => {
      const b = state.berita.find(x => x.id === id);
      if (!b) return;
      updateDoc(doc(db, 'berita', id), { views: increment(1) }).catch(() => {});
      document.getElementById('modal-badge').textContent = b.kategori;
      document.getElementById('modal-body').innerHTML = `<img src="${b.gambar}" class="w-full h-60 object-cover rounded-xl mb-4" /><h2 class="text-xl font-extrabold mb-2">${b.judul}</h2><div class="text-xs text-slate-500 mb-4">${b.tanggal}</div><div class="text-sm text-slate-700 whitespace-pre-line">${b.isi}</div>`;
      document.getElementById('detail-modal').classList.remove('hidden');
    };
    window.openAgenda = (id) => {
      const a = state.agenda.find(x => x.id === id);
      if (!a) return;
      document.getElementById('modal-badge').textContent = a.jenis;
      document.getElementById('modal-body').innerHTML = `<h2 class="text-xl font-extrabold mb-2">${a.judul}</h2><div class="text-xs text-slate-500 mb-3">${a.jadwal} • ${a.lokasi}</div><p class="text-sm text-slate-700">${a.keterangan}</p>`;
      document.getElementById('detail-modal').classList.remove('hidden');
    };
    window.kirimPesan = async (e) => {
      e.preventDefault();
      await addDoc(collection(db, 'pesan_warga'), {
        nama: document.getElementById('pw-nama').value.trim(),
        kontak: document.getElementById('pw-kontak').value.trim(),
        subjek: document.getElementById('pw-subjek').value.trim(),
        pesan: document.getElementById('pw-pesan').value.trim(),
        tanggal: new Date().toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' }),
        createdAt: serverTimestamp()
      });
      e.target.reset();
      const ok = document.getElementById('pw-ok');
      ok.textContent = 'Pesan berhasil terkirim ke Database Pengelola!';
      ok.classList.remove('hidden');
    };

    initApp();
  </script>
</body>
</html>
